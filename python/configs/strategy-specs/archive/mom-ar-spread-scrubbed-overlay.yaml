# Momentum AR-Spread + Scrubbing + Defensive Overlay Variant
#
# Archived methodology branch. Deterministic unit tests now cover the cash
# overlay trigger and non-trigger paths, so the overlay implementation is not
# dead code. This candidate remains archived because the evaluated methodology
# branch was not selected as active after review.
#
# Identical to `mom-ar-spread-scrubbed.yaml` except for enabling
# the existing `nzx_ma200_agg_momentum` cash overlay after fixing its aggregate
# momentum condition to use the cross-sectional mean of raw 12-1 momentum.
#
# Read-only — create a new strategy spec instead of editing historical specs.
name: mom-ar-spread-scrubbed-overlay
description: "Archived momentum + AR spread + scrubber + NZX MA200 overlay"
asof: 2026-01-01
master_seed: 42
n_trials_prior: 30

universe:
  min_adv_dollars: 10000.0
  min_market_cap_nzd: 0.0
  min_history_days: 126
  adv_window: 20
  mc_ffill_days: 5
  nzx_only: true

factors:
  - kind: momentum
    min_months: 11
    smoothing_months: 3

cost:
  spread_bps: 200.0
  sharesies_monthly_fee_nzd: 15.0
  sharesies_coverage_nzd: 5000.0
  sharesies_excess_bps: 190.0
  spread_model: abdi_ranaldo
  spread_estimator_window: 60
  spread_estimator_min_obs: 20
  spread_estimator_scale: 1.0
  spread_estimator_min_bps_per_side: 5.0

backtest:
  initial_nav_nzd: 10000.0
  cash_floor: 0.05
  max_position: 0.25
  max_sector: 0.25
  score_lambda: 0.0
  no_trade_threshold_frac: 0.005
  size_floor_nzd: 50.0
  size_floor_cost_multiple: 5.0
  return_window_days: 252
  min_return_obs: 63
  flat_haircut_bps: 400.0
  risk_free_annual: 0.035
  min_positions_per_month: 1
  degenerate_fold_max_empty_frac: 0.5

overlay:
  kind: nzx_ma200_agg_momentum
  defensive_cash_fraction: 0.30
  momentum_aggregate_lookback_months: 12

scrubbing:
  kind: round_trip
  threshold: 0.30
  reversal_tolerance: 0.10

adjustments:
  kind: audit

walk_forward:
  two_fold_enabled: true
  rolling:
    train_years: 5
    oos_years: 1
    step_years: 1

survivorship:
  monte_carlo_seeds: 500
  delisting_csv_relpath: "src/survivorship/nzx_delistings.csv"

gating:
  alpha: 0.05
  bootstrap_n_resamples: 2000
  dominance_n_resamples: 2000
  sanity_floor: 0.0

benchmarks:
  td_floor_default: 0.04
  nzx_eq_mcap_floor_nzd: 20000000.0
  nzx_eq_adv_floor_shares: 10000.0
  sixty_forty_equity_proxy: "FNZ.NZ"
  sixty_forty_bond_macro_field: "long_term_interest_rates"
  sixty_forty_flat_haircut_bps: 50.0

output:
  report_dir_relpath: "reports"
  ledger_scope: exploration
