[project]
name = "skuld-portfolio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "skuld-common",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skuld_portfolio"]

[tool.uv.sources]
skuld-common = { workspace = true }
