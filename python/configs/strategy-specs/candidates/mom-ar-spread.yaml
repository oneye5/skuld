# Momentum Abdi-Ranaldo Spread Variant
#
# Replaces the flat 200-bps-per-side spread cost assumption with per-ticker,
# time-varying spread estimates derived from the Abdi-Ranaldo (2017) OHLC
# spread estimator. Rationale:
#
# 1. The flat 200 bps/side (effectively 400 bps quoted) is a deliberately
#    pessimistic constant that overstates costs for liquid NZX names (FNZ,
#    SPK, AIA) and understates them for thin small-caps. This was a major
#    contributor to the strategy's negative net Sharpe in `mom-no-mcap`,
#    not a true edge problem.
# 2. Hardcoded ticker→bps tables were rejected by the user as ad hoc and
#    fragile. The Abdi-Ranaldo estimator computes a per-side spread from
#    raw OHLC alone — no ticker-specific tuning, no liquidity tier table.
# 3. Empirical sanity check on real NZX data (window=60d) shows the
#    estimator produces sensible relative ordering (FNZ ~22 bps narrowest
#    among liquid names; KMD ~102 bps for an illiquid mid-cap) but biases
#    absolute levels upward by ~2-3x for actively-traded names. This is a
#    known property of effective-spread estimators. We keep `scale: 1.0`
#    here as the conservative baseline; calibration is left to a follow-up
#    spec once we have a clearer view of realised slippage.
#
# Difference vs mom-no-mcap:
#   cost.spread_model: abdi_ranaldo  (was implicitly "flat")
#   plus default estimator parameters (window=60, min_obs=20, scale=1.0,
#   min_bps_per_side=5.0). Per-side `spread_bps: 200.0` is retained as the
#   fallback rate for tickers with insufficient OHLC history.
#
# All other knobs identical to mom-no-mcap.
#
# Read-only — create a new strategy spec instead of editing historical specs.
name: mom-ar-spread
description: "Momentum + 3-month smoothing + Abdi-Ranaldo per-ticker spread"
asof: 2026-01-01
master_seed: 42
n_trials_prior: 30

universe:
  min_adv_dollars: 10000.0
  min_market_cap_nzd: 0.0
  min_history_days: 126
  adv_window: 20
  mc_ffill_days: 5
  nzx_only: true

factors:
  - kind: momentum
    min_months: 11
    smoothing_months: 3

cost:
  spread_bps: 200.0
  sharesies_monthly_fee_nzd: 15.0
  sharesies_coverage_nzd: 5000.0
  sharesies_excess_bps: 190.0
  spread_model: abdi_ranaldo
  spread_estimator_window: 60
  spread_estimator_min_obs: 20
  spread_estimator_scale: 1.0
  spread_estimator_min_bps_per_side: 5.0

backtest:
  initial_nav_nzd: 10000.0
  cash_floor: 0.05
  max_position: 0.25
  max_sector: 0.25
  score_lambda: 0.0
  no_trade_threshold_frac: 0.005
  size_floor_nzd: 50.0
  size_floor_cost_multiple: 5.0
  return_window_days: 252
  min_return_obs: 63
  flat_haircut_bps: 400.0
  risk_free_annual: 0.035
  min_positions_per_month: 1
  degenerate_fold_max_empty_frac: 0.5

# Corporate-action adjustment audit (read-only). Does not modify prices; attaches
# AdjustmentAuditReport to RawData for ongoing visibility into missed_split,
# bad_div_adjust and similar issues. Does NOT change any backtest output.
# See docs/ADJUSTMENTS.md for taxonomy and known false-positive patterns.
adjustments:
  kind: audit

walk_forward:
  two_fold_enabled: true
  rolling:
    train_years: 5
    oos_years: 1
    step_years: 1

survivorship:
  monte_carlo_seeds: 500
  delisting_csv_relpath: "src/survivorship/nzx_delistings.csv"

gating:
  alpha: 0.05
  bootstrap_n_resamples: 2000
  dominance_n_resamples: 2000
  sanity_floor: 0.0

benchmarks:
  td_floor_default: 0.04
  nzx_eq_mcap_floor_nzd: 20000000.0
  nzx_eq_adv_floor_shares: 10000.0
  sixty_forty_equity_proxy: "FNZ.NZ"
  sixty_forty_bond_macro_field: "long_term_interest_rates"
  sixty_forty_flat_haircut_bps: 50.0

output:
  report_dir_relpath: "reports"
  ledger_scope: exploration
