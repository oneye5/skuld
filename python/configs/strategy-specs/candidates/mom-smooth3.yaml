# Momentum-smoothed-3 Spec — turnover-reduction variant
#
# Hypothesis: mom-baseline pays ~22%/month turnover (16177 NZD cost on
# 10000 NZD NAV across 11 OOS folds) for monthly rebalancing on the raw 12-1
# momentum signal. IC diagnostics show the momentum signal peaks at horizon
# ~6 months (IC 0.13), so monthly score-to-score noise is largely paid for in
# costs. Averaging the raw 12-1 score across the trailing 3 rebalance dates
# should cut score volatility (and therefore turnover) without throwing away
# the underlying signal.
#
# Difference vs mom-baseline: factors[].smoothing_months: 3 (was 1).
# All other knobs (universe, cost, backtest, walk_forward, survivorship,
# gating, benchmarks, output) are identical to mom-baseline.
#
# Read-only — create a new strategy spec instead of editing historical specs.
name: mom-smooth3
description: "Momentum baseline + 3-month momentum score smoothing"
asof: 2026-01-01
master_seed: 42
n_trials_prior: 30

universe:
  min_adv_dollars: 10000.0
  min_market_cap_nzd: 20000000.0
  min_history_days: 126
  adv_window: 20
  mc_ffill_days: 5
  nzx_only: true

factors:
  - kind: momentum
    min_months: 11
    smoothing_months: 3

cost:
  spread_bps: 200.0
  sharesies_monthly_fee_nzd: 15.0
  sharesies_coverage_nzd: 5000.0
  sharesies_excess_bps: 190.0

backtest:
  initial_nav_nzd: 10000.0
  cash_floor: 0.05
  max_position: 0.25
  max_sector: 0.25
  score_lambda: 0.0
  no_trade_threshold_frac: 0.005
  size_floor_nzd: 50.0
  size_floor_cost_multiple: 5.0
  return_window_days: 252
  min_return_obs: 63
  flat_haircut_bps: 400.0
  risk_free_annual: 0.035
  min_positions_per_month: 1
  degenerate_fold_max_empty_frac: 0.5

# See mom-ar-spread.yaml for rationale. Audit-only; no price mutation.
adjustments:
  kind: audit

walk_forward:
  two_fold_enabled: true
  rolling:
    train_years: 5
    oos_years: 1
    step_years: 1

survivorship:
  monte_carlo_seeds: 500
  delisting_csv_relpath: "src/survivorship/nzx_delistings.csv"

gating:
  alpha: 0.05
  bootstrap_n_resamples: 2000
  dominance_n_resamples: 2000
  sanity_floor: 0.0

benchmarks:
  td_floor_default: 0.04
  nzx_eq_mcap_floor_nzd: 20000000.0
  nzx_eq_adv_floor_shares: 10000.0
  sixty_forty_equity_proxy: "FNZ.NZ"
  sixty_forty_bond_macro_field: "long_term_interest_rates"
  sixty_forty_flat_haircut_bps: 50.0

output:
  report_dir_relpath: "reports"
  ledger_scope: exploration
