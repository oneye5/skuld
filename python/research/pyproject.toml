[project]
name = "skuld-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "skuld-common",
    "pandas>=2.0",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skuld_research"]

[tool.uv.sources]
skuld-common = { workspace = true }
