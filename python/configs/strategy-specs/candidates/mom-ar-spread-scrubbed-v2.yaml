# Momentum AR-Spread + Round-Trip Scrubbing v2
#
# Builds on `mom-ar-spread-scrubbed.yaml` (the baseline scrubbed spec) with
# three construction improvements enabled by T4 of the 2026-05-03 improvement
# plan:
#
#   1. score_lambda: 0.3
#      Tilts ERC weights toward signal rank. Tickers ranked higher by momentum
#      receive modestly larger allocations.  At 0.3 this is a mild tilt; the
#      portfolio remains close to risk-parity but no longer completely ignores
#      the signal at the weighting stage.
#
#   2. smoothing_alpha: 0.3
#      Blends each month's target weights with the prior portfolio:
#        new_target = 0.7 * optimizer_target + 0.3 * current_weights
#      Reduces whipsawing in thin markets; typical turnover reduction ~20-30%.
#
#   3. turnover_budget_frac: 0.20
#      Caps one-sided turnover at 20% of NAV per rebalance.  Trades that would
#      exceed the budget are ranked by expected alpha (combined score × 100 bps)
#      and the lowest-priority trades are deferred. Forced liquidations of
#      delisted / universe-exited tickers are exempt.
#
#   4. min_names: 5
#      Requires at least 5 investable names at a rebalance date. Dates with
#      fewer (e.g. very early in the sample when history thresholds exclude
#      most tickers) fall back to the prior portfolio rather than taking a
#      highly concentrated bet.
#
# All data settings (scrubbing, AR spread, adjustments, universe filters) are
# identical to the baseline.
#
# Read-only — create a new strategy spec instead of editing this file.
name: mom-ar-spread-scrubbed-v2
description: "Momentum + AR spread + round-trip scrubber v2 (score_lambda=0.3, smoothing=0.3, turnover cap)"
asof: 2026-01-01
master_seed: 42
n_trials_prior: 30

universe:
  min_adv_dollars: 10000.0
  min_market_cap_nzd: 0.0
  min_history_days: 126
  adv_window: 20
  mc_ffill_days: 5
  nzx_only: true

factors:
  - kind: momentum
    min_months: 11
    smoothing_months: 3

cost:
  spread_bps: 200.0
  sharesies_monthly_fee_nzd: 15.0
  sharesies_coverage_nzd: 5000.0
  sharesies_excess_bps: 190.0
  spread_model: abdi_ranaldo
  spread_estimator_window: 60
  spread_estimator_min_obs: 20
  spread_estimator_scale: 1.0
  spread_estimator_min_bps_per_side: 5.0

backtest:
  initial_nav_nzd: 10000.0
  cash_floor: 0.05
  max_position: 0.25
  max_sector: 0.25
  min_names: 5
  score_lambda: 0.3
  smoothing_alpha: 0.3
  no_trade_threshold_frac: 0.005
  size_floor_nzd: 50.0
  size_floor_cost_multiple: 5.0
  return_window_days: 252
  min_return_obs: 63
  flat_haircut_bps: 400.0
  risk_free_annual: 0.035
  min_positions_per_month: 1
  degenerate_fold_max_empty_frac: 0.5
  turnover_budget_frac: 0.20

scrubbing:
  kind: round_trip
  threshold: 0.30
  reversal_tolerance: 0.10

# Corporate-action adjustment audit (read-only). Does not modify prices; attaches
# AdjustmentAuditReport to RawData for ongoing visibility into missed_split,
# bad_div_adjust and similar issues. Does NOT change any backtest output.
adjustments:
  kind: audit

walk_forward:
  two_fold_enabled: true
  rolling:
    train_years: 5
    oos_years: 1
    step_years: 1

survivorship:
  monte_carlo_seeds: 500
  delisting_csv_relpath: "src/survivorship/nzx_delistings.csv"

gating:
  alpha: 0.05
  bootstrap_n_resamples: 2000
  dominance_n_resamples: 2000
  sanity_floor: 0.0

benchmarks:
  td_floor_default: 0.04
  nzx_eq_mcap_floor_nzd: 20000000.0
  nzx_eq_adv_floor_shares: 10000.0
  sixty_forty_equity_proxy: "FNZ.NZ"
  sixty_forty_bond_macro_field: "long_term_interest_rates"
  sixty_forty_bond_duration_years: 6.0
  sixty_forty_flat_haircut_bps: 50.0

output:
  report_dir_relpath: "reports"
  ledger_scope: exploration
