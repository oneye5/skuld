# Phase 2 exploration candidate: time-series filtered momentum.
name: phase2-mom-ts-filter
description: "Phase 2 exploration: stock-level time-series filtered momentum plus mom-s8 return-on-risk"
asof: 2026-05-03
master_seed: 42
n_trials_prior: 30

universe: {min_adv_dollars: 10000.0, min_market_cap_nzd: 0.0, min_history_days: 126, adv_window: 20, mc_ffill_days: 5, nzx_only: true}
factors:
  - {kind: time_series_filtered_momentum, min_months: 11, ma_days: 252, downtrend_discount: 0.0}
  - {kind: return_on_risk, lookback_months: 12, min_months: 6}
cost: {spread_bps: 200.0, sharesies_monthly_fee_nzd: 15.0, sharesies_coverage_nzd: 5000.0, sharesies_excess_bps: 190.0, spread_model: abdi_ranaldo, spread_estimator_window: 60, spread_estimator_min_obs: 20, spread_estimator_scale: 1.0, spread_estimator_min_bps_per_side: 5.0}
backtest: {initial_nav_nzd: 10000.0, cash_floor: 0.05, max_position: 0.25, max_sector: 0.25, min_names: 10, score_lambda: 0.5, no_trade_threshold_frac: 0.005, size_floor_nzd: 50.0, size_floor_cost_multiple: 5.0, return_window_days: 252, min_return_obs: 63, flat_haircut_bps: 400.0, risk_free_annual: 0.035, min_positions_per_month: 1, degenerate_fold_max_empty_frac: 0.5, turnover_budget_frac: 0.30}
scrubbing: {kind: round_trip, threshold: 0.30, reversal_tolerance: 0.10}
anomaly_filter: {kind: mask_extremes, daily_abs_return_threshold: 0.5, monthly_abs_return_threshold: 1.0, volume_gate_threshold: 0.20, require_volume_confirmation: true, corporate_action_buffer_days: 5, chronic_ticker_max_extreme_days: 5}
