[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-ml"
version = "0.1.0"
description = "Machine learning project for trading predictions"
requires-python = ">=3.9"
authors = [
    {name = "Developer"},
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.9.0",
    "joblib>=1.2.0",
    "xgboost>=1.7.0",
    "lightgbm>=3.3.0",
    "polars>=0.18.0",
    "pyarrow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = "test_*.py"
