# Momentum AR-Spread + Round-Trip Scrubbing Variant
#
# Identical to `mom-ar-spread.yaml` except for the addition of
# the round-trip raw-data scrubber (`scrubbing.kind: round_trip`).
#
# Motivation:
#   The dominance diagnostic (`docs/specs/2026-04-30-phase1-dominance-diagnostic.md`)
#   showed a single 2010-01-04 SKT.NZ corruption (-84% intraday print followed
#   by a +546% reversion) inflated January 2010's portfolio month to +63%.
#   Because monthly returns are computed via `(1 + r_daily).prod()`, the
#   bad print and its rebound both survive into the monthly product even
#   though month-end-to-month-end resampling shows a benign -4.95% for SKT
#   that month. This kind of round-trip artefact contaminates the strategy
#   variance and pushes dominance p-values up.
#
# Scrubber rule (see `skuld_research.data.scrubber`):
#   Flag day t for ticker if |r_t| > threshold AND
#   |(1+r_t)(1+r_{t+1}) - 1| < reversal_tolerance.
#   Replace p_t with sqrt(p_{t-1} * p_{t+1}) (geometric mean of surrounding
#   prints). First/last observations skipped; per-ticker dropna scan avoids
#   cross-ticker NaN contamination on holidays.
#
# Empirical effect on this panel: 247 events flagged across 23 tickers
# (NTL.NZ, BAI.NZ, LIC.NZ, AIR.NZ, ALF.NZ, PHL.NZ, MHJ.NZ, SKT.NZ, ...),
# 2000-05-09 to 2023-01-30. SKT.NZ 2010-01-04 cleaned 5.05 -> 32.36 (vs ~$32
# surrounding prints).
#
# Difference vs mom-ar-spread:
#   scrubbing:
#     kind: round_trip
#     threshold: 0.30
#     reversal_tolerance: 0.10
#
# All other knobs identical.
#
# Read-only — create a new strategy spec instead of editing historical specs.
name: mom-ar-spread-scrubbed
description: "Momentum + 3-month smoothing + AR spread + round-trip scrubber"
asof: 2026-01-01
master_seed: 42
n_trials_prior: 30

universe:
  min_adv_dollars: 10000.0
  min_market_cap_nzd: 0.0
  min_history_days: 126
  adv_window: 20
  mc_ffill_days: 5
  nzx_only: true

factors:
  - kind: momentum
    min_months: 11
    smoothing_months: 3

cost:
  spread_bps: 200.0
  sharesies_monthly_fee_nzd: 15.0
  sharesies_coverage_nzd: 5000.0
  sharesies_excess_bps: 190.0
  spread_model: abdi_ranaldo
  spread_estimator_window: 60
  spread_estimator_min_obs: 20
  spread_estimator_scale: 1.0
  spread_estimator_min_bps_per_side: 5.0

backtest:
  initial_nav_nzd: 10000.0
  cash_floor: 0.05
  max_position: 0.25
  max_sector: 0.25
  score_lambda: 0.0
  no_trade_threshold_frac: 0.005
  size_floor_nzd: 50.0
  size_floor_cost_multiple: 5.0
  return_window_days: 252
  min_return_obs: 63
  flat_haircut_bps: 400.0
  risk_free_annual: 0.035
  min_positions_per_month: 1
  degenerate_fold_max_empty_frac: 0.5

scrubbing:
  kind: round_trip
  threshold: 0.30
  reversal_tolerance: 0.10

# Corporate-action adjustment audit (read-only). Does not modify prices; attaches
# AdjustmentAuditReport to RawData for ongoing visibility into missed_split,
# bad_div_adjust and similar issues. Does NOT change any backtest output.
# See docs/ADJUSTMENTS.md for taxonomy and known false-positive patterns
# (notably 2x/0.5x oscillations on illiquid microcap names).
adjustments:
  kind: audit

walk_forward:
  two_fold_enabled: true
  rolling:
    train_years: 5
    oos_years: 1
    step_years: 1

survivorship:
  monte_carlo_seeds: 500
  delisting_csv_relpath: "src/survivorship/nzx_delistings.csv"

gating:
  alpha: 0.05
  bootstrap_n_resamples: 2000
  dominance_n_resamples: 2000
  sanity_floor: 0.0

benchmarks:
  td_floor_default: 0.04
  nzx_eq_mcap_floor_nzd: 20000000.0
  nzx_eq_adv_floor_shares: 10000.0
  sixty_forty_equity_proxy: "FNZ.NZ"
  sixty_forty_bond_macro_field: "long_term_interest_rates"
  sixty_forty_bond_duration_years: 6.0
  sixty_forty_flat_haircut_bps: 50.0

output:
  report_dir_relpath: "reports"
  ledger_scope: exploration
