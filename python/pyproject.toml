[project]
name = "skuld"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["common", "research", "portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
